<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FizzBuzz Terminal</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 16px;
    }

    #terminal {
      box-sizing: border-box;
      height: 100%;
      padding: 16px;
      overflow-y: auto;
    }

    #screen div {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #input-line {
      display: flex;
      margin: 0;
    }

    #prompt {
      white-space: pre;
    }

    #input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      caret-color: #fff;
    }

    #run {
      margin-top: 12px;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      padding: 4px 16px;
      font: inherit;
      cursor: pointer;
    }

    #run:hover, #run:focus-visible {
      background: #fff;
      color: #000;
    }

    #input-line[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="terminal">
    <div id="screen" aria-live="polite"></div>
    <form id="input-line" autocomplete="off">
      <label id="prompt" for="input">Enter a number (0 to quit): </label>
      <input id="input" type="text" inputmode="numeric" spellcheck="false">
    </form>
    <button id="run" type="button" hidden>Run</button>
  </main>

  <script type="module" src="../dist/main.js"></script>
</body>
</html>
